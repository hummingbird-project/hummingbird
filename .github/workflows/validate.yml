name: Validity Check

on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-validate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: hummingbird-project/hummingbird-project-template/.github/workflows/validate.yml@4f3de818e52fd7a2f447b55b62ea0bf5dbec3df9 # v0.0.1
