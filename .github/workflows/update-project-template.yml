name: Update from project template

on:
  schedule:
    - cron: "15 0 1 * *"
  push:
    branches:
    - main
    paths:
    - '.hummingbird-project-template.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: macOS-latest
    steps:
    - name: App Token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
      id: generate-token
      with:
        client-id: ${{ secrets.HB_APP_ID }}
        private-key: ${{ secrets.HB_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
    - name: Checkout Project Template
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 1
        path: project-template
        repository: hummingbird-project/hummingbird-project-template
    - name: Checkout Target Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 1
        path: hummingbird
    - name: Install Dependencies
      run: |
        brew install hummingbird-project/tap/swift-mustache-cli
    - name: Update Target Repository
      run: |
        cd project-template
        ./update.sh ../hummingbird
    - name: Set Commit message
      run: |
        cd project-template
        {
          echo 'GIT_COMMIT_MESSAGE<<EOF'
          git log -1 --pretty=medium
          echo EOF
        } >> "$GITHUB_ENV"
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
      with:
        token: ${{ steps.generate-token.outputs.token }}
        path: hummingbird
        commit-message: 'Update from hummingbird-project-template ${{ github.sha }}'
        committer: GitHub <noreply@github.com>
        author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        branch: project-template-update
        title: 'Update from Hummingbird Project Template'
        body: |
          ${{ env.GIT_COMMIT_MESSAGE }}
          Automated update of files from https://github.com/hummingbird-project/hummingbird-project-template
        base: main
