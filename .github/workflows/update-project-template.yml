name: Update from project template

on:
  schedule:
    - cron: "15 0 1 * *"
  push:
    branches:
    - main
    paths:
    - '.hummingbird-project-template.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  update-project:
    uses: hummingbird-project/hummingbird-project-template/.github/workflows/update-project-template.yml@4f3de818e52fd7a2f447b55b62ea0bf5dbec3df9 # v0.0.1
    with:
      project-name: hummingbird
    secrets:
      app-client-id: ${{ secrets.HB_APP_ID }}
      app-private-key: ${{ secrets.HB_APP_PRIVATE_KEY }}
