name: Verify Documentation

on:
  pull_request:
    branches:
    - main
    paths:
    - '**.swift'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-verifydocs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-documentation:
    uses: hummingbird-project/hummingbird-project-template/.github/workflows/verify-documentation.yml@4f3de818e52fd7a2f447b55b62ea0bf5dbec3df9 # v0.0.1

