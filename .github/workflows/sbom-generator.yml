name: Generate SBOM

on:
  push:
    branches:
    - main
    paths:
    - '**.swift'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-sbom
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  generate-sbom:
    uses: hummingbird-project/hummingbird-project-template/.github/workflows/sbom-generator.yml@4f3de818e52fd7a2f447b55b62ea0bf5dbec3df9 # v0.0.1
    secrets:
      app-client-id: ${{ secrets.HB_APP_ID }}
      app-private-key: ${{ secrets.HB_APP_PRIVATE_KEY }}
